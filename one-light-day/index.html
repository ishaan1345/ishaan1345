<style>
/* Layout: the sky fills the screen. A caption card sits bottom-left like a museum label, live telemetry is top-left, the angular scale is bottom-right, and etched gold annotations float on the sky. */
:root{
  --void:#04050a;
  --ink:#ece9e0;
  --ink-soft:#c8c4b6;
  --dim:#8f8a7b;
  --gold:#d9b46a;
  --gold-soft:rgba(217,180,106,.6);
  --gold-faint:rgba(217,180,106,.28);
  --blue:#a6cdff;
  --line:rgba(236,233,224,.13);
  --panel:rgba(5,6,11,.66);
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--serif);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#sky:active{cursor:grabbing}
button{font:inherit;color:inherit}

.mono{font-family:var(--mono)}
.k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.v{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* telemetry */
.tele{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:auto auto;gap:5px 14px;align-items:baseline;pointer-events:none;text-shadow:0 0 8px var(--void)}
.tele .narrow-only{display:none}
.tele .who{grid-column:1 / -1;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.tools{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip[aria-pressed="true"]{color:var(--gold);border-color:var(--gold-faint)}
.chip:focus-visible,.nav button:focus-visible{outline:1.5px solid var(--gold);outline-offset:2px}

/* caption card */
.card{position:fixed;z-index:3;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(31rem,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px 20px 14px;-webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1);transition:opacity .35s ease,transform .35s ease}
.card::before{content:"";position:absolute;left:-1px;top:14px;width:2px;height:22px;background:var(--gold)}
.card.away{opacity:0;transform:translateY(8px);pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.card h1,.card h2{font-family:var(--serif);font-weight:400;font-optical-sizing:auto;margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance;line-height:1.05}
.card h1{font-size:clamp(34px,7.5vw,46px)}
.card h2{font-size:clamp(25px,5.6vw,31px)}
.body{font-size:17.5px;line-height:1.5;color:var(--ink-soft);margin:0;max-width:62ch;text-wrap:pretty}
.body b{font-weight:500;color:var(--ink)}
.body q{font-style:italic;color:var(--ink)}
.live{font-family:var(--mono);font-size:.84em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.nav .count{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);font-variant-numeric:tabular-nums}
.nav .btns{display:flex;gap:8px}
.nav button{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;cursor:pointer;color:var(--ink-soft)}
.nav button.primary{border-color:var(--gold-soft);color:var(--void);background:var(--gold)}
.nav button:disabled{opacity:.35;cursor:default}
.hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);margin:10px 0 0}
.story-pill{position:fixed;z-index:3;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}

/* angular scale */
.scale{position:fixed;z-index:2;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;justify-items:end;gap:6px;pointer-events:none;text-shadow:0 0 8px var(--void)}
.scale .bar{height:7px;border:1px solid var(--gold-soft);border-top:0}
.scale .fov{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* annotations on the sky */
.tags{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap;display:none;text-shadow:0 0 6px #000,0 0 2px #000}
.tag.left .tick{left:auto;right:calc(var(--d,26px) / 2 - 1px)}
.tag.left .txt{left:auto;right:calc(var(--d,26px) / 2 + 19px);justify-items:end;text-align:right}
.tag .ring{position:absolute;left:0;top:0;width:var(--d,26px);height:var(--d,26px);margin:calc(var(--d,26px) / -2) 0 0 calc(var(--d,26px) / -2);border:1px solid var(--gold-soft);border-radius:50%}
.tag .tick{position:absolute;left:calc(var(--d,26px) / 2 - 1px);top:-.5px;width:16px;height:1px;background:var(--gold-soft)}
.tag .txt{position:absolute;left:calc(var(--d,26px) / 2 + 19px);top:-9px;display:grid;gap:1px}
.tag .nm{font-family:var(--serif);font-size:15px;color:var(--ink);line-height:1.1}
.tag .nt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--gold);line-height:1.2}
.tag.star .ring{border-color:rgba(236,233,224,.28)}
.tag.star .tick{background:rgba(236,233,224,.28)}
.tag.star .nm{font-size:13px;color:var(--ink-soft)}
.tag.earth .ring{border-color:var(--blue)}
.tag.earth .tick{background:var(--blue)}
.tag.earth .nm{color:var(--blue)}
.tag.cons{transform-origin:0 0}
.tag.cons .lbl{display:block;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10.5px;letter-spacing:.42em;text-transform:uppercase;color:rgba(217,180,106,.62)}
.tag.heading .ring{border-style:dashed;border-color:var(--gold)}
.moonref{position:absolute;left:0;top:0;border:1px dashed rgba(236,233,224,.45);border-radius:50%}
.moonref span{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-soft);white-space:nowrap;text-align:center;line-height:1.4}

.err{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.err p{max-width:34ch;font-size:18px;line-height:1.5;color:var(--ink-soft)}

@media (max-width:560px){
  .card{left:0;right:0;width:auto;bottom:0;border-radius:0;border-left:0;border-right:0;border-bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
  .card::before{display:none}
  .body{font-size:16px}
  .scale{display:none}
  .tele .narrow-only{display:block}
  .tele{gap:3px 10px}
  .tele .v{font-size:11.5px}
}
@media (max-height:520px) and (orientation:landscape){.body{font-size:15px}.card{padding:12px 16px 10px}.card h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
